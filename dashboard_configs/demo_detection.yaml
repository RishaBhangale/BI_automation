# ──────────────────────────────────────────────────────────────────────────────
# demo_detection.yaml — Connection config for Demo Dashboard
#
# This file only contains what the test runner actually needs:
#   1. dashboard.url    → the Power BI report to open
#   2. dashboard.pages  → which pages exist (for switch_to_page)
#   3. source_db        → DB credentials for SQL validation
#
# Test cases (slicers, KPIs, scenarios) live in:
#   test_data/business_scenarios.xlsx
# SQL queries are auto-generated at runtime via:
#   utils/sql_template_engine.py
# ──────────────────────────────────────────────────────────────────────────────

dashboard:
  name: "Demo Dashboard"
  url: "https://app.powerbi.com/groups/me/reports/2057f32d-34f2-4ad0-91bb-5d66ea1675e7/0ffb75878226303bc6af?ctid=b5af2451-e21b-4aa2-b4b5-dc5907908dd8&experience=power-bi"
  pages:
    - "Summary"
    - "Self - Service"

source_db:
  driver:   "mssql+pymssql"
  host:     "aibidevsqlsvr.database.windows.net"
  port:     "1433"
  database: "devaibisqldb"
  username: "${DB_USER}"
  password: "${DB_PASSWORD}"
